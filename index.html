<!-- fed-poster-embed.html -->
<div id="fed-poster-widget" style="font-family: Arial; max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background: #f9f9f9;">
  <h3 style="margin: 0 0 15px 0;">📤 FED-POSTER</h3>
  
  <!-- User enters their API Key -->
  <input id="fed-api-key" type="text" placeholder="Enter your FED-POSTER API Key" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
  
  <!-- Select Platform -->
  <select id="fed-platform" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
    <option value="telegram">Telegram</option>
    <option value="discord">Discord</option>
    <option value="gist">GitHub Gist</option>
    <option value="mastodon">Mastodon</option>
    <option value="bluesky">Bluesky</option>
    <option value="stoat">Stoat</option>
  </select>

  <!-- User enters their destination -->
  <input id="fed-destination" type="text" placeholder="Chat ID / Webhook URL / Instance" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
  
  <!-- User enters their content -->
  <textarea id="fed-content" rows="4" placeholder="Enter your post content..." style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
  
  <button id="fed-post-btn" style="background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px;">🚀 Post Now</button>
  
  <div id="fed-result" style="margin-top: 15px; padding: 10px; background: white; border-radius: 5px; border: 1px solid #eee; min-height: 30px; font-size: 14px; white-space: pre-wrap;"></div>
</div>

<script>
document.getElementById('fed-post-btn').addEventListener('click', async function() {
  const apiKey = document.getElementById('fed-api-key').value.trim();
  const platform = document.getElementById('fed-platform').value;
  const destination = document.getElementById('fed-destination').value.trim();
  const content = document.getElementById('fed-content').value.trim();
  const resultDiv = document.getElementById('fed-result');

  // Validation
  if (!apiKey) { resultDiv.innerHTML = '❌ Please enter your API Key.'; return; }
  if (!content) { resultDiv.innerHTML = '❌ Please enter content.'; return; }
  if (!destination) { resultDiv.innerHTML = '❌ Please enter destination (Chat ID / Webhook URL / Instance).'; return; }

  resultDiv.innerHTML = '⏳ Posting...';

  // Build request body
  let body = { platform, content: { text: content } };

  switch (platform) {
    case 'telegram':
      body.content.chat_id = destination;
      break;
    case 'discord':
      body.content.webhook_url = destination;
      break;
    case 'gist':
      body.content.filename = 'post.txt';
      body.content.description = 'FED-POSTER Gist';
      break;
    case 'mastodon':
      body.content.instance = destination;
      const mastodonToken = prompt('Enter your Mastodon Access Token:');
      if (!mastodonToken) { resultDiv.innerHTML = '❌ Cancelled.'; return; }
      body.content.access_token = mastodonToken;
      break;
    case 'bluesky':
      body.content.pds = destination || 'https://bsky.social';
      const bskyToken = prompt('Enter your Bluesky Access Token:');
      const did = prompt('Enter your Bluesky DID:');
      if (!bskyToken || !did) { resultDiv.innerHTML = '❌ Cancelled.'; return; }
      body.content.access_token = bskyToken;
      body.content.did = did;
      break;
    case 'stoat':
      body.content.webhook_url = destination;
      break;
    default:
      resultDiv.innerHTML = '❌ Unknown platform.';
      return;
  }

  try {
    // ✅ UPDATED: This is your live Supabase Edge Function URL
    const response = await fetch('https://vfhxnzthcksflmylkede.supabase.co/functions/v1/post', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    const data = await response.json();

    if (response.ok && data.success) {
      resultDiv.innerHTML = `✅ Posted successfully!<br>Remaining credits today: ${data.credits_remaining}`;
    } else {
      resultDiv.innerHTML = `❌ Error: ${data.error || 'Unknown error'}`;
    }
  } catch (error) {
    resultDiv.innerHTML = `❌ Network Error: ${error.message}`;
  }
});
</script>
